name: Publish Python package

# Publishes alluvial to PyPI with trusted publishing when a GitHub release is published.
# The release tag must match the version in pyproject.toml, like v0.6.0.

on:
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0

      - name: Check the version matches the release tag
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: test "v$(uv version --short)" = "$TAG"

      - name: Test
        run: uv run --locked --extra dev pytest -q

      - name: Build
        run: uv build

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/project/alluvial/

    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist/

      # v1.14.3 or later: certifi 2026.10.19 and sigstore 4.5.1 (the emSign CA removal)
      - uses: pypa/gh-action-pypi-publish@v1.14.3
